services:

  opal-mist:
    build: .
    # Host networking so the app uses the host's DNS resolvers and routing —
    # required for the SMTP forwarder, which is only reachable from the host
    # network stack. In host mode "ports:" is ignored, so the app binds the
    # host port directly (keep it 9091 so the HPE edge upstream is unchanged).
    network_mode: host
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9091"]
    # Corporate DNS resolvers. Docker otherwise substitutes public DNS
    # (8.8.8.8) which can't resolve internal names like the SMTP relay.
    # Set OPAL_DNS1/OPAL_DNS2 in a (gitignored) .env on the prod host.
    dns:
      - ${OPAL_DNS1:-8.8.8.8}
      - ${OPAL_DNS2:-8.8.4.4}
    volumes:
      - ./data:/data
      # Sibling app's data dir (same host) so records can be moved between DBs.
      - ../opal/data:/data-other
    environment:
      DB_PATH: /data/opal-mist.db
      BACKUP_DIR: /data/backups
      ROOT_PATH: /opal-mist
      OPAL_FERNET_KEY: ${OPAL_FERNET_KEY:-}
      OTHER_DB_PATH: /data-other/opal.db
      OTHER_APP_NAME: Opal-Central
    restart: unless-stopped

  ingest:
    build: .
    volumes:
      - ./data:/data
      - ./csv:/csv:ro
    environment:
      DB_PATH: /data/opal-mist.db
    entrypoint: ["python3", "ingest.py"]
    command: ["/csv/engagement.csv"]
    profiles:
      - ingest
